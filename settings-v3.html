<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 通知 — DeepSeek Harness</title><style>
:root{color-scheme:dark;font:14px/1.6 system-ui,sans-serif;color:#e7eaf4;background:#15171d}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 14px}p,small{color:#a9b0c2}p{margin:4px 0 20px}section{background:#20232d;border:1px solid #363c4d;border-radius:12px;padding:20px;margin:18px 0}.field{display:grid;gap:7px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}input[type=text],select{font:inherit;color:inherit;background:#15171d;border:1px solid #4a5267;border-radius:7px;padding:9px 11px;width:100%}input[type=checkbox]{width:21px;height:21px;accent-color:#8499f5}button,.upload{display:inline-block;font:inherit;color:inherit;background:#30384d;border:1px solid #515e7c;border-radius:7px;padding:9px 14px;cursor:pointer}button.primary{background:#5368bb;border-color:#7187df}button:disabled{opacity:.5;cursor:wait}input:focus-visible,select:focus-visible,button:focus-visible,.upload:focus-within{outline:2px solid #a5b8ff;outline-offset:2px}.icon-row{display:flex;align-items:center;gap:14px}.icon-row img{width:64px;height:64px;object-fit:contain;background:repeating-conic-gradient(#343945 0% 25%,#292d37 0% 50%) 50%/14px 14px;border-radius:8px;padding:4px}.icon-row>div{flex:1}.upload{font-size:12px;margin-top:8px}.upload input{max-width:210px}.actions{position:sticky;bottom:0;padding:14px 0;background:#15171df5;display:flex;gap:10px;flex-wrap:wrap}#status{min-height:25px;margin-top:12px}#status.error{color:#ffadad}.preview{background:#242532;border-radius:10px;padding:15px;margin-top:16px}.source{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:12px}.source img{width:20px;height:20px;object-fit:contain}.toast{display:flex;gap:12px}.toast img{width:48px;height:48px;object-fit:contain}.toast strong{display:block}.toast span{color:#a9b0c2;font-size:13px}#footer{margin-top:12px}a{color:#a7baff}@media(max-width:480px){body{padding:12px}section{padding:15px}.icon-row{align-items:flex-start}}
fieldset{min-inline-size:0}input,select,.icon-row>div{min-width:0}.upload input{width:100%;max-width:100%}h1,h2{overflow-wrap:anywhere}body{overflow-x:hidden}@media(max-width:360px){.icon-row{flex-direction:column}.icon-row>div{width:100%}.actions button{max-width:100%;white-space:normal}}
button:disabled{cursor:default}.preview button:disabled{cursor:default}
:root{color:var(--dsw-alias-label-primary,#f5f5f5);background:var(--dsw-alias-bg-layer-3,#202020)}section{background:transparent;border:0;border-bottom:.5px solid var(--dsw-alias-border-l2,#555);border-radius:0;padding:16px 0;margin:0}.label,h2{font-size:14px;font-weight:400}p,small{color:var(--dsw-alias-label-tertiary,#bbb)}input[type=text],select{background:var(--dsw-alias-bg-module-platform,#1b1b1b);border:.5px solid var(--dsw-alias-border-l2,#555);border-radius:8px}.actions{background:var(--dsw-alias-bg-layer-3,#202020)}
</style></head><body><main>
<h1>Windows 通知</h1><p>自定义 dsh 的通知来源、提示文字和图标。</p>
<form id="form"><fieldset id="fields" disabled style="border:0;padding:0;margin:0">
<section><h2>提醒时机</h2><label class="row" for="notifyWhenFocused"><span>聚焦时也弹出通知<br><small>关闭时，正在看 dsh 不提醒；切走或最小化后提醒。</small></span><input id="notifyWhenFocused" type="checkbox" role="switch"></label></section>
<section><h2>应用来源（通知顶部）</h2><label class="field">显示应用名字<input id="appName" type="text" maxlength="64" required></label>
<div class="icon-row"><img id="appPreview" alt="应用来源图标"><div><label class="field">显示应用图标<select id="appIcon"><option value="official">官方</option><option value="whale">大肥鱼</option><option value="custom">自定义图片</option></select></label><label class="upload">上传应用图标 <input id="appUpload" type="file" accept="image/png,image/jpeg,image/webp,image/x-icon,.ico"></label></div></div></section>
<section><h2>提示内容</h2><label class="field">提问标题<input id="questionTitle" type="text" maxlength="100" required></label><label class="field">操作确认标题<input id="approvalTitle" type="text" maxlength="100" required></label><label class="field">对话结束标题<input id="completionTitle" type="text" maxlength="100" required></label>
<div class="icon-row"><img id="notificationPreview" alt="提示内容图标"><div><label class="field">提示图标<select id="notificationIcon"><option value="whale">大肥鱼</option><option value="official">官方</option><option value="custom">自定义图片</option></select></label><label class="upload">上传提示图标 <input id="notificationUpload" type="file" accept="image/png,image/jpeg,image/webp,image/x-icon,.ico"></label></div></div><small>图片不超过 4 MB，最长边不超过 4096 像素。透明 PNG 会保留透明背景。</small></section>
<section><h2>通知预览</h2><select id="previewKind" aria-label="预览通知类型"><option value="question">提问通知</option><option value="completed">对话完成通知</option></select><div class="preview"><div class="source"><img id="sourcePreview" alt=""><span id="sourceName"></span></div><div class="toast"><img id="bodyPreview" alt=""><div><strong id="titlePreview"></strong><span>这里显示 dsh 的问题或本轮完成提示。</span></div></div><div style="margin-top:12px"><button type="button" disabled>确认收到</button></div></div><small>“确认收到”只收起通知；点击正文或“打开 dsh”会收起通知并打开 dsh，问题仍需在 dsh 内回答。</small></section>
<div class="actions"><button class="primary" id="save" type="submit">保存设置</button><button id="test" type="button">保存并发送测试</button><button id="reset" type="button">恢复默认预览</button></div>
</fieldset></form><div id="status" role="status" aria-live="polite">正在加载…</div><small>测试通知会临时忽略聚焦状态；实际通知遵循上方开关。</small><div id="footer"><a href="/">返回 dsh</a></div>
</main><script src="/dsh-notifications/settings.js"></script><script src="/dsh-notifications/focus.js"></script></body></html>
